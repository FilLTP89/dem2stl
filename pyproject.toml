[build-system]  
requires = ["setuptools>=45", "wheel"]  
build-backend = "setuptools.build_meta"  
  
[project]  
name = "dem2stl"  
version = "1.1.0"  
description = "Converts a Digital Elevation Model (DEM) topography surface to the STereoLithography (STL) format"  
readme = "README.md"  
requires-python = ">=3.6"  
license = {text = "LGPL-3.0-or-later"}  
authors = [  
    {name = "Carlos Veiga Rodrigues", email = "cvrodrigues@gmail.com"}  
]  
classifiers = [  
    "Development Status :: 4 - Beta",  
    "Intended Audience :: Science/Research",  
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",  
    "Operating System :: OS Independent",  
    "Programming Language :: Python :: 3",  
    "Topic :: Scientific/Engineering :: GIS",  
]  
dependencies = [  
    "GDAL>=2.0.0",  
    "pyproj>=2.0.0",  
    "numpy>=1.15.0",  
    "utm>=0.4.0",  
]  
  
[project.urls]  
Homepage = "https://github.com/FilLTP89/dem2stl"  
  
[project.scripts]  
dem2stl = "dem2stl:main"